spring.application.name=exam
server.port=8081
#chp phep hien thi log INFO tu package project
logging.level.vn.edu.hanu.exam=INFO 

#database config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online_exam}
spring.datasource.username=${DB_USERNAME:online_exam_app}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.pool-name=ExamDatabasePool

#chay schema.sql khi app khoi dong
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8